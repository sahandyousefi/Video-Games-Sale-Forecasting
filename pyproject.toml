[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgsales"
version = "0.1.0"
description = "Pre-release forecasting of video game unit sales with time-aware validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sahand Yousefi" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gbm = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
dl = ["torch>=2.1"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44", "matplotlib>=3.7"]
track = ["mlflow>=2.9"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "httpx>=0.27"]
all = ["vgsales[gbm,dl,tune,explain,track,serve,viz]"]

[project.urls]
Repository = "https://github.com/sahandyousefi/Video-Games-Sale-Forecasting"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# The legacy Kaggle notebook is kept unchanged as a record of the original analysis.
extend-exclude = [
    "ml-models-and-cross-validation.ipynb",
    "notebooks/00_original_exploration.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
