# Default configuration for the pre-release sales forecasting pipeline.
seed: 42

data:
  raw_path: data/raw/vgchartz-2024.csv
  # Date of the data snapshot. When null it is taken as the latest last_update.
  snapshot_date: null
  min_release_year: 1980
  max_release_year: null
  # Releases within this many years of the snapshot are flagged as right-censored.
  censoring_window_years: 2

target:
  column: total_sales
  transform: log1p

split:
  # The last release years with observed sales form the untouched test set.
  holdout_years: 3
  cv_folds: 5
  min_train_years: 10
  gap_years: 0

features:
  # One-hot encoded; categories rarer than min_category_count are pooled.
  categorical: [console, genre]
  # Encoded by training frequency and by the target mean of earlier years.
  high_cardinality: [publisher, developer]
  # Produced by vgsales.features.prerelease; missing values are imputed.
  numeric:
    - release_year
    - release_month
    - release_quarter
    - holiday_season
    - platform_age_years
    - n_platforms
    - is_port
    - critic_score
    - critic_missing
  min_category_count: 5
  target_encoding_smoothing: 20.0

models:
  # Compared on identical expanding-window folds by `vgsales evaluate`.
  # Boosting models need the gbm extras and the MLP needs the dl extras; models
  # whose library is not installed are skipped.
  evaluate: [global_median, group_median, ridge, xgboost, lightgbm, catboost, mlp]
  # Fitted on all development years by `vgsales train`.
  train: ridge
  # Keyword arguments of each model's estimator. For boosting models,
  # n_estimators is the maximum number of rounds, and for the MLP max_epochs
  # is the maximum number of epochs; the number used is chosen by early
  # stopping on the last validation_years of each training window.
  params:
    group_median:
      min_count: 5
    ridge:
      alpha: 1.0
    xgboost:
      n_estimators: 2000
      learning_rate: 0.05
      early_stopping_rounds: 100
      validation_years: 2
      max_depth: 6
      min_child_weight: 5.0
      subsample: 0.8
      colsample_bytree: 0.8
    lightgbm:
      n_estimators: 2000
      learning_rate: 0.05
      early_stopping_rounds: 100
      validation_years: 2
      num_leaves: 31
      min_child_samples: 20
      min_data_per_group: 50
    catboost:
      n_estimators: 2000
      learning_rate: 0.05
      early_stopping_rounds: 100
      validation_years: 2
      depth: 6
      l2_leaf_reg: 3.0
    mlp:
      hidden: [128, 64]
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.00001
      batch_size: 256
      max_epochs: 200
      patience: 20
      validation_years: 2

series:
  # Monthly sales of tracked titles by release month, evaluated by
  # `vgsales series` from rolling origins. The series end before the
  # censoring window; segments with fewer than min_titles titles are dropped.
  by: [genre, platform_family]
  start: "1995-01-01"
  min_titles: 50
  horizon: 12
  n_origins: 5
  origin_step: 12
  min_history: 60
  season: 12
  # The GRU needs the dl extras and is skipped when torch is not installed.
  models: [seasonal_naive, ses, ets, gru]
  reference: seasonal_naive
  params:
    gru:
      input_length: 24
      hidden_size: 32
      segment_dim: 4
      dropout: 0.1
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 128
      max_epochs: 100
      patience: 15
      validation_months: 24

tuning:
  # Optuna search run by `vgsales tune` on the expanding-window folds of the
  # development years. With n_trials null the search runs until timeout
  # (seconds). Trials are pruned by the median rule after n_startup_trials
  # completed trials and never before n_warmup_steps folds are scored.
  n_trials: 50
  timeout: null
  metric: rmsle
  n_startup_trials: 5
  n_warmup_steps: 1

intervals:
  # Central (1 - alpha) prediction intervals, scored on the expanding-window
  # folds of the development years by coverage, width and interval score.
  alpha: 0.1
  # quantile: LightGBM quantile regression; conformal: split conformal
  # intervals around point_model, calibrated on the last calibration_years of
  # each training window.
  methods: [quantile, conformal]
  # Keyword arguments of the LightGBM quantile models (gbm extras), one model
  # per quantile level alpha/2, 1/2 and 1 - alpha/2. Rounds are selected by
  # early stopping on the pinball loss over the last validation_years of each
  # training window.
  quantile_params:
    n_estimators: 2000
    learning_rate: 0.05
    early_stopping_rounds: 100
    validation_years: 2
    num_leaves: 31
    min_child_samples: 20
    min_data_per_group: 50
  # Registered point model with its models.params.
  point_model: lightgbm
  calibration_years: 2

output:
  model_dir: models
  report_dir: reports
  # Tuned parameters, one YAML file per model, applied with --tuned.
  tuned_dir: configs/tuned
